<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d19">
  <meta name="description" content="Explore operating system concepts and compare six CPU scheduling techniques with interactive Gantt charts.">
  <title>Operating System — Learning Map &amp; Scheduling Simulator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d19;
      --surface: #101827;
      --surface-raised: #141f31;
      --text: #edf4ff;
      --muted: #98a8bf;
      --line: rgba(157, 181, 215, .18);
      --blue: #53a7ff;
      --green: #43d6a2;
      --orange: #ffad5c;
      --radius: 20px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -14%, rgba(55, 105, 178, .2), transparent 49%),
        radial-gradient(rgba(133, 160, 204, .10) .7px, transparent .7px) 0 0 / 24px 24px,
        var(--bg);
    }
    button { font: inherit; }
    .page { width: min(1360px, calc(100% - 48px)); margin: 0 auto; padding: 52px 0 44px; }
    .hero { text-align: center; position: relative; z-index: 1; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px;
      border: 1px solid rgba(119, 166, 232, .2); border-radius: 999px;
      color: #aec8ea; background: rgba(51, 91, 145, .12);
      font-size: .72rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #70b8ff; box-shadow: 0 0 12px #70b8ff; }
    h1 { margin: 19px 0 10px; font-size: clamp(2.25rem, 5vw, 4.15rem); line-height: 1.04; letter-spacing: -.055em; }
    .gradient-text { color: transparent; background: linear-gradient(100deg, #f4f8ff 28%, #8fc5ff 72%, #72e3ca); background-clip: text; }
    .hero p { max-width: 650px; margin: 0 auto; color: var(--muted); font-size: clamp(.94rem, 1.5vw, 1.05rem); line-height: 1.65; }
    .map { position: relative; margin-top: 39px; }
    .topic-grid { display: grid; width: min(800px, 100%); grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; margin: 0 auto; }
    .topic-column { position: relative; min-width: 0; --accent: var(--blue); --glow: rgba(83, 167, 255, .18); }
    .topic-column.green { --accent: var(--green); --glow: rgba(67, 214, 162, .15); }
    .topic-column.orange { --accent: var(--orange); --glow: rgba(255, 173, 92, .16); }
    .topic-card {
      overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
      border-radius: var(--radius); background: linear-gradient(155deg, rgba(20, 31, 49, .98), rgba(12, 19, 32, .98));
      box-shadow: 0 15px 48px rgba(0, 0, 0, .22), 0 0 34px var(--glow);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .topic-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 54%, transparent); box-shadow: 0 20px 54px rgba(0, 0, 0, .3), 0 0 42px var(--glow); }
    .topic-head { padding: 19px 18px 15px; }
    .topic-topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .topic-icon { display: grid; width: 43px; height: 43px; flex: 0 0 auto; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 13px; color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .topic-icon svg { width: 22px; height: 22px; }
    .topic-toggle { display: flex; width: 100%; align-items: center; gap: 13px; padding: 0; border: 0; color: inherit; text-align: left; background: transparent; cursor: pointer; }
    .topic-title { display: block; font-size: 1.04rem; line-height: 1.32; font-weight: 760; letter-spacing: -.02em; }
    .topic-kicker { display: block; margin-top: 5px; color: var(--muted); font-size: .75rem; }
    .chevron { display: grid; width: 29px; height: 29px; flex: 0 0 auto; place-items: center; margin-left: auto; border: 1px solid rgba(170, 191, 220, .16); border-radius: 9px; color: #afc1db; transition: transform .24s ease, background .2s; }
    .chevron svg { width: 14px; height: 14px; }
    [aria-expanded="true"] > .chevron { transform: rotate(90deg); background: rgba(255,255,255,.06); }
    .topic-toggle:focus-visible, .node-toggle:focus-visible { outline: 2px solid var(--accent, #8fc5ff); outline-offset: 3px; }
    .topic-hint { display: flex; align-items: center; gap: 7px; margin: 16px 0 0 56px; color: #91a2ba; font-size: .72rem; }
    .topic-hint .hint-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .branch { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .36s cubic-bezier(.2,.7,.2,1), opacity .25s ease; }
    .branch.is-open { grid-template-rows: 1fr; opacity: 1; }
    .branch-inner { min-height: 0; overflow: hidden; }
    .topic-branch > .branch-inner { border-top: 1px solid rgba(155, 179, 212, .1); }
    .tree { list-style: none; margin: 0; padding: 13px 13px 15px 18px; }
    .tree-item { position: relative; padding-left: 17px; }
    .tree-item + .tree-item { margin-top: 7px; }
    .tree-item::before { position: absolute; content: ""; top: -12px; bottom: 14px; left: 4px; border-left: 1px solid rgba(143, 166, 198, .27); }
    .tree-item::after { position: absolute; content: ""; top: 16px; left: 4px; width: 12px; border-top: 1px solid rgba(143, 166, 198, .34); }
    .tree-item:last-child::before { bottom: auto; height: 29px; }
    .node-box { overflow: hidden; border: 1px solid rgba(148, 171, 203, .13); border-radius: 12px; background: rgba(17, 27, 43, .76); transition: border-color .2s, background .2s; }
    .node-box:hover, .node-box.is-active { border-color: color-mix(in srgb, var(--accent) 42%, transparent); background: rgba(24, 38, 59, .9); }
    .node-toggle { display: flex; width: 100%; min-height: 43px; align-items: center; gap: 9px; padding: 8px 9px 8px 11px; border: 0; color: #dce7f7; text-align: left; background: transparent; cursor: pointer; }
    .node-marker { width: 7px; height: 7px; flex: 0 0 auto; border: 1px solid var(--accent); border-radius: 2px; background: color-mix(in srgb, var(--accent) 27%, transparent); transform: rotate(45deg); }
    .node-label { min-width: 0; font-size: .82rem; line-height: 1.35; font-weight: 660; }
    .node-toggle .chevron { width: 24px; height: 24px; }
    .node-description { margin: 0 11px 11px 27px; padding: 9px 0 0; border-top: 1px solid rgba(155, 179, 212, .1); color: #aab9ce; font-size: .75rem; line-height: 1.55; }
    .node-branch > .branch-inner { padding: 0 8px 8px 0; }
    .node-branch .tree { padding: 4px 0 0 14px; }
    .node-branch .tree-item { padding-left: 14px; }
    .node-branch .tree-item::after { width: 10px; }
    .scheduler { margin: 0 13px 18px; padding: 18px; border: 1px solid rgba(255, 173, 92, .2); border-radius: 16px; background: rgba(12, 19, 32, .72); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .scheduler-heading h2 { margin: 0; font-size: 1.08rem; letter-spacing: -.02em; }
    .scheduler-heading p, .scheduler-help { color: var(--muted); font-size: .78rem; line-height: 1.55; }
    .scheduler-heading p { margin: 7px 0 0; }
    .scheduler-help { margin: 12px 0; }
    .process-table-wrap, .metrics-wrap { overflow-x: auto; }
    .process-table, .metrics-table { width: 100%; border-collapse: collapse; text-align: left; }
    .process-table { min-width: 540px; }
    .process-table th, .metrics-table th { padding: 8px 7px; color: #9fb2cc; font-size: .7rem; font-weight: 700; }
    .process-table td, .metrics-table td { padding: 6px 7px; border-top: 1px solid rgba(155, 179, 212, .1); }
    .process-table input, .quantum-control input { width: 100%; min-height: 36px; padding: 7px 9px; border: 1px solid rgba(148, 171, 203, .22); border-radius: 8px; color: var(--text); background: rgba(7, 13, 24, .72); font: inherit; font-size: .8rem; }
    .process-table input:focus, .quantum-control input:focus { outline: 2px solid rgba(255, 173, 92, .75); outline-offset: 1px; }
    .process-table .process-id { width: 100px; }
    .remove-process, .secondary-button, .calculate-button { min-height: 36px; padding: 7px 11px; border: 1px solid rgba(148, 171, 203, .2); border-radius: 9px; color: #dce7f7; background: rgba(255, 255, 255, .04); cursor: pointer; font: inherit; font-size: .76rem; font-weight: 650; }
    .remove-process { min-width: 36px; padding: 5px 9px; }
    .remove-process:hover, .secondary-button:hover { background: rgba(255, 255, 255, .09); }
    .scheduler-actions { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-top: 13px; }
    .quantum-control { display: grid; width: 130px; gap: 5px; color: #bdcbe0; font-size: .72rem; font-weight: 650; }
    .calculate-button { border-color: rgba(255, 173, 92, .48); color: #17120c; background: var(--orange); }
    .calculate-button:hover { background: #ffc17f; }
    .scheduler-error { margin: 12px 0 0; color: #ff9e9e; font-size: .8rem; }
    .scheduler-results { display: grid; gap: 14px; margin-top: 18px; }
    .scheduler-placeholder { margin: 0; padding: 15px; border: 1px dashed rgba(148, 171, 203, .2); border-radius: 10px; color: var(--muted); font-size: .8rem; text-align: center; }
    .schedule-result { min-width: 0; padding: 15px; border: 1px solid rgba(148, 171, 203, .14); border-radius: 13px; background: rgba(20, 31, 49, .56); }
    .schedule-result h3 { margin: 0; font-size: .91rem; }
    .schedule-result > p { margin: 5px 0 12px; color: var(--muted); font-size: .72rem; line-height: 1.45; }
    .gantt-scroll { overflow-x: auto; padding-bottom: 5px; }
    .gantt-inner { display: grid; gap: 5px; }
    .gantt-track, .gantt-times { display: grid; grid-template-columns: inherit; }
    .gantt-block { display: grid; min-height: 48px; align-content: center; justify-items: center; gap: 2px; border-right: 2px solid #101827; border-radius: 5px; color: #08111e; font-size: .71rem; font-weight: 760; }
    .gantt-block small { font-size: .64rem; font-weight: 600; }
    .gantt-block.idle { color: #c4cede; background: #39465a; }
    .gantt-times span { display: flex; justify-content: space-between; color: #99abc3; font-size: .64rem; }
    .metrics-heading { margin: 14px 0 5px; color: #c4d2e5; font-size: .72rem; font-weight: 700; }
    .metrics-table { min-width: 390px; }
    .metrics-table th, .metrics-table td { padding: 6px 7px; font-size: .68rem; }
    .metrics-average { margin: 9px 0 0; color: #c4d2e5; font-size: .72rem; }
    .footer-note { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 26px 0 0; color: #73849c; font-size: .74rem; text-align: center; }
    .footer-note svg { width: 14px; height: 14px; color: #83a9d9; }
    @media (min-width: 1000px) { .topic-card { min-height: 164px; } }
    @media (max-width: 900px) {
      .page { width: min(760px, calc(100% - 36px)); padding-top: 38px; }
      .topic-grid { gap: 18px; }
      .topic-head { padding: 16px 14px 14px; }
      .topic-icon { width: 38px; height: 38px; }
      .topic-title { font-size: .92rem; }
      .topic-hint { margin-left: 50px; }
    }
    @media (max-width: 650px) {
      .page { width: min(460px, calc(100% - 30px)); padding: 31px 0 32px; }
      .hero p { max-width: 390px; }
      .map { margin-top: 28px; }
      .topic-grid { grid-template-columns: minmax(0, 1fr); gap: 18px; }
      .topic-card { min-height: 0; }
      .topic-head { padding: 16px 17px 14px; }
      .topic-title { font-size: 1rem; }
      .tree { padding-left: 19px; }
      .scheduler { margin: 0 9px 14px; padding: 13px; }
      .schedule-result { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>

<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">Interactive learning map</div>
      <h1><span class="gradient-text">Operating System</span></h1>
      <p>Explore core operating system concepts one branch at a time. Open CPU Scheduling to enter process data and compare six techniques with interactive Gantt charts.</p>
    </header>

    <section class="map" aria-label="Operating system topic tree">
      <div class="topic-grid" id="topic-grid"></div>
    </section>
    <p class="footer-note">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 16 5v4.2c0 4.1-2.5 6.8-6 8.3-3.5-1.5-6-4.2-6-8.3V5l6-2.5Z" stroke="currentColor" stroke-width="1.4"/><path d="m7.4 9.9 1.7 1.7 3.6-3.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      A growing study map · Expand any branch to explore
    </p>
  </main>

  <script>
    // Add or edit learning nodes here; each node can have its own nested children.
    const topics = [
      {
        id: "process-management",
        title: "Process Management",
        short: "Processes, states & control",
        icon: "process",
        color: "blue",
        children: [
          {
            title: "Process Concept",
            description: "A process is a program in execution, together with its current state and the resources it uses.",
            children: [
              { title: "Program vs. Process", description: "A program is a passive set of instructions; a process is an active instance of those instructions." },
              { title: "Process States", description: "Common states include new, ready, running, waiting, and terminated; the OS moves processes between them." }
            ]
          },
          {
            title: "Process Control Block (PCB)",
            description: "The OS keeps per-process information in a PCB, such as its state, program counter, CPU registers, and scheduling data."
          },
          {
            title: "Process Operations",
            description: "The OS creates, schedules, suspends, resumes, and terminates processes as programs run.",
            children: [
              { title: "Creation & Termination", description: "A process may create child processes, and eventually exits or is terminated by the OS." },
              { title: "Context Switching", description: "The OS saves one process's CPU state and restores another's so the processor can switch between them." }
            ]
          },
          {
            title: "Threads",
            description: "Threads are execution paths within a process. They share process resources while maintaining their own execution state.",
            children: [
              { title: "User-Level Threads", description: "Managed by a user-space thread library, without each operation requiring a kernel thread operation." },
              { title: "Kernel-Level Threads", description: "Managed and scheduled by the operating system kernel." }
            ]
          }
        ]
      },
      {
        id: "ipc",
        title: "Inter Process Communication (IPC)",
        short: "Processes exchange data & signals",
        icon: "ipc",
        color: "green",
        children: [
          {
            title: "Shared Memory",
            description: "Processes communicate by reading and writing a shared memory region; synchronization is needed to coordinate access.",
            children: [
              { title: "Synchronization", description: "Coordination mechanisms help processes safely access shared data without conflicting updates." },
              { title: "Producer–Consumer", description: "A common pattern where one process produces data and another consumes it through a shared buffer." }
            ]
          },
          {
            title: "Message Passing",
            description: "Processes exchange discrete messages through OS-managed send and receive operations.",
            children: [
              { title: "Pipes", description: "A byte stream that commonly connects related processes; a named pipe can also be accessed by name." },
              { title: "Message Queues", description: "Messages are stored in a queue and retrieved by receiving processes, often with message boundaries preserved." },
              { title: "Sockets", description: "Communication endpoints that let processes exchange data locally or across a network." }
            ]
          },
          {
            title: "Signals",
            description: "Signals provide a lightweight way to notify a process that an event has occurred; they generally carry little data."
          }
        ]
      },
      {
        id: "cpu-scheduling",
        title: "CPU Scheduling",
        short: "Choosing the next process to run",
        icon: "cpu",
        color: "orange",
        children: [
          {
            title: "Scheduling Types",
            description: "Scheduling can be classified by whether the OS may take the CPU away from a running process.",
            children: [
              {
                title: "Preemptive Scheduling",
                description: "The OS may interrupt a running process and reassign the CPU, for example when a time slice expires or a higher-priority task arrives.",
                children: [
                  { title: "Round Robin (RR)", description: "Each ready process gets a fixed time quantum in turn; an unfinished process returns to the ready queue." },
                  { title: "Shortest Remaining Time First (SRTF)", description: "The preemptive form of shortest-job scheduling: run the process with the least CPU burst time remaining." },
                  { title: "Preemptive Priority", description: "The CPU is assigned to the highest-priority ready process; a newly ready higher-priority process may preempt it." }
                ]
              },
              {
                title: "Non-Preemptive Scheduling",
                description: "Once a process gets the CPU, it keeps it until it finishes its CPU burst or blocks voluntarily.",
                children: [
                  { title: "First-Come, First-Served (FCFS)", description: "Processes run in the order they arrive in the ready queue." },
                  { title: "Shortest Job First (SJF)", description: "Among ready processes, choose the one with the shortest predicted next CPU burst." },
                  { title: "Non-Preemptive Priority", description: "Choose the highest-priority ready process; it keeps the CPU until its burst completes or it blocks." }
                ]
              }
            ]
          }
        ]
      }
    ];

    const icons = {
      process: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="14" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 7h3a2 2 0 0 1 2 2v5M13.5 17h-3a2 2 0 0 1-2-2v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="m7 11-1.5 1.5L4 11m13-2 1.5-1.5L20 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      ipc: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5h10a2 2 0 0 1 2 2V12m-2 5.5H8a2 2 0 0 1-2-2V12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="m13 9 3 3 3-3m-8 6-3-3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="6.5" r="1.5" fill="currentColor"/><circle cx="20" cy="17.5" r="1.5" fill="currentColor"/></svg>',
      cpu: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h6v6H9zM9 2.5v3m6-3v3M9 18.5v3m6-3v3M2.5 9h3m-3 6h3m13-6h3m-3 6h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      chevron: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 3.5 4.5 4.5L6 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    const grid = document.querySelector("#topic-grid");

    function makeNode(node) {
      const item = document.createElement("li");
      item.className = "tree-item";
      const box = document.createElement("div");
      box.className = "node-box";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "node-toggle";
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", `${node.title}${node.children?.length ? ", expand branch" : ", show explanation"}`);
      const marker = document.createElement("span");
      marker.className = "node-marker";
      marker.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.className = "node-label";
      label.textContent = node.title;
      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.innerHTML = icons.chevron;
      chevron.setAttribute("aria-hidden", "true");
      toggle.append(marker, label, chevron);
      box.append(toggle);

      if (node.description) {
        const description = document.createElement("p");
        description.className = "node-description branch";
        description.setAttribute("aria-hidden", "true");
        const inner = document.createElement("span");
        inner.className = "branch-inner";
        inner.textContent = node.description;
        description.append(inner);
        box.append(description);
      }
      if (node.children?.length) {
        const branch = document.createElement("div");
        branch.className = "branch node-branch";
        branch.setAttribute("aria-hidden", "true");
        const inner = document.createElement("div");
        inner.className = "branch-inner";
        const childList = document.createElement("ul");
        childList.className = "tree";
        node.children.forEach(child => childList.append(makeNode(child)));
        inner.append(childList);
        branch.append(inner);
        box.append(branch);
      }
      toggle.addEventListener("click", () => {
        const isOpen = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!isOpen));
        box.classList.toggle("is-active", !isOpen);
        box.querySelectorAll(":scope > .branch").forEach(branch => {
          branch.classList.toggle("is-open", !isOpen);
          branch.setAttribute("aria-hidden", String(isOpen));
        });
      });
      item.append(box);
      return item;
    }

    function createProcess(values, index) {
      return { ...values, index, remaining: values.burst };
    }

    function addGanttSegment(segments, pid, start, end) {
      if (end <= start) return;
      const previous = segments[segments.length - 1];
      if (previous && previous.pid === pid && previous.end === start) {
        previous.end = end;
      } else {
        segments.push({ pid, start, end });
      }
    }

    function scheduleNonPreemptive(processes, strategy) {
      const pending = processes.map(process => createProcess(process, process.index));
      const segments = [];
      const completion = new Map();
      let time = 0;

      while (pending.length) {
        const ready = pending.filter(process => process.arrival <= time);
        if (!ready.length) {
          const nextArrival = Math.min(...pending.map(process => process.arrival));
          addGanttSegment(segments, "IDLE", time, nextArrival);
          time = nextArrival;
          continue;
        }

        ready.sort(strategy);
        const process = ready[0];
        const start = time;
        time += process.burst;
        addGanttSegment(segments, process.pid, start, time);
        completion.set(process.pid, time);
        pending.splice(pending.indexOf(process), 1);
      }

      return { segments, completion };
    }

    function schedulePreemptive(processes, strategy) {
      const pending = processes.map(process => createProcess(process, process.index));
      const segments = [];
      const completion = new Map();
      let time = 0;
      let completed = 0;

      while (completed < pending.length) {
        const ready = pending.filter(process => process.remaining > 0 && process.arrival <= time);
        if (!ready.length) {
          const nextArrival = Math.min(...pending
            .filter(process => process.remaining > 0)
            .map(process => process.arrival));
          addGanttSegment(segments, "IDLE", time, nextArrival);
          time = nextArrival;
          continue;
        }

        ready.sort(strategy);
        const process = ready[0];
        const nextArrival = pending
          .filter(candidate => candidate.remaining > 0 && candidate.arrival > time)
          .reduce((next, candidate) => Math.min(next, candidate.arrival), Infinity);
        const runFor = Math.min(process.remaining, nextArrival - time);
        addGanttSegment(segments, process.pid, time, time + runFor);
        process.remaining -= runFor;
        time += runFor;

        if (process.remaining === 0) {
          completion.set(process.pid, time);
          completed += 1;
        }
      }

      return { segments, completion };
    }

    function scheduleRoundRobin(processes, quantum) {
      const ordered = processes
        .map(process => createProcess(process, process.index))
        .sort((a, b) => a.arrival - b.arrival || a.index - b.index);
      const segments = [];
      const completion = new Map();
      const ready = [];
      let time = 0;
      let nextProcess = 0;

      while (completion.size < ordered.length) {
        if (!ready.length && nextProcess < ordered.length && time < ordered[nextProcess].arrival) {
          const nextArrival = ordered[nextProcess].arrival;
          addGanttSegment(segments, "IDLE", time, nextArrival);
          time = nextArrival;
        }

        while (nextProcess < ordered.length && ordered[nextProcess].arrival <= time) {
          ready.push(ordered[nextProcess]);
          nextProcess += 1;
        }

        const process = ready.shift();
        const runFor = Math.min(quantum, process.remaining);
        addGanttSegment(segments, process.pid, time, time + runFor);
        process.remaining -= runFor;
        time += runFor;

        while (nextProcess < ordered.length && ordered[nextProcess].arrival <= time) {
          ready.push(ordered[nextProcess]);
          nextProcess += 1;
        }

        if (process.remaining > 0) {
          ready.push(process);
        } else {
          completion.set(process.pid, time);
        }
      }

      return { segments, completion };
    }

    function renderScheduleResult(algorithm, processes, schedule) {
      const result = document.createElement("article");
      result.className = "schedule-result";
      const heading = document.createElement("h3");
      heading.textContent = algorithm.name;
      const description = document.createElement("p");
      description.textContent = algorithm.description;
      result.append(heading, description);

      const chartScroll = document.createElement("div");
      chartScroll.className = "gantt-scroll";
      chartScroll.setAttribute("role", "img");
      const chart = document.createElement("div");
      chart.className = "gantt-inner";
      chart.style.minWidth = `${Math.max(100, schedule.segments.length * 64)}px`;
      chart.style.gridTemplateColumns = schedule.segments
        .map(segment => `minmax(64px, ${segment.end - segment.start}fr)`)
        .join(" ");
      chartScroll.setAttribute("aria-label", `${algorithm.name} Gantt chart: ${schedule.segments.map(segment => `${segment.pid} from ${segment.start} to ${segment.end}`).join(", ")}`);
      const track = document.createElement("div");
      track.className = "gantt-track";
      for (const segment of schedule.segments) {
        const block = document.createElement("div");
        block.className = `gantt-block${segment.pid === "IDLE" ? " idle" : ""}`;
        if (segment.pid !== "IDLE") {
          const process = processes.find(candidate => candidate.pid === segment.pid);
          block.style.background = ["#8fc5ff", "#72e3ca", "#ffcf8a", "#d6b4ff", "#ff9fa5", "#b6d99a"][process.index % 6];
        }
        block.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.textContent = segment.pid;
        const duration = document.createElement("small");
        duration.textContent = `${segment.end - segment.start} ${segment.end - segment.start === 1 ? "unit" : "units"}`;
        block.append(label, duration);
        track.append(block);
      }
      const times = document.createElement("div");
      times.className = "gantt-times";
      schedule.segments.forEach(segment => {
        const timeLabel = document.createElement("span");
        timeLabel.textContent = `${segment.start} — ${segment.end}`;
        times.append(timeLabel);
      });
      chart.append(track, times);
      chartScroll.append(chart);
      result.append(chartScroll);

      const metricsHeading = document.createElement("div");
      metricsHeading.className = "metrics-heading";
      metricsHeading.textContent = "Process timing (time units)";
      const metricsWrap = document.createElement("div");
      metricsWrap.className = "metrics-wrap";
      const table = document.createElement("table");
      table.className = "metrics-table";
      const tableHead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      ["Process", "Completion", "Turnaround", "Waiting"].forEach(text => {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = text;
        headerRow.append(cell);
      });
      tableHead.append(headerRow);
      const tableBody = document.createElement("tbody");
      let totalTurnaround = 0;
      let totalWaiting = 0;
      processes.forEach(process => {
        const completion = schedule.completion.get(process.pid);
        const turnaround = completion - process.arrival;
        const waiting = turnaround - process.burst;
        totalTurnaround += turnaround;
        totalWaiting += waiting;
        const row = document.createElement("tr");
        [process.pid, completion, turnaround, waiting].forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = String(value);
          row.append(cell);
        });
        tableBody.append(row);
      });
      table.append(tableHead, tableBody);
      metricsWrap.append(table);
      const average = document.createElement("p");
      average.className = "metrics-average";
      average.textContent = `Average turnaround: ${(totalTurnaround / processes.length).toFixed(2)} · Average waiting: ${(totalWaiting / processes.length).toFixed(2)}`;
      result.append(metricsHeading, metricsWrap, average);
      return result;
    }

    function makeScheduler() {
      const scheduler = document.createElement("section");
      scheduler.className = "scheduler";
      scheduler.setAttribute("aria-labelledby", "scheduler-title");
      scheduler.innerHTML = `
        <div class="scheduler-heading">
          <h2 id="scheduler-title">Scheduling Simulator</h2>
          <p>Enter process details to compare all six CPU scheduling techniques.</p>
        </div>
        <p class="scheduler-help">Priority uses smaller numbers for higher priority. Arrival and burst times must be whole numbers; the Round Robin quantum is shared by all charts.</p>
        <form class="scheduler-form" novalidate>
          <div class="process-table-wrap">
            <table class="process-table">
              <thead><tr><th scope="col">Process ID</th><th scope="col">Arrival time</th><th scope="col">Burst time</th><th scope="col">Priority</th><th scope="col"><span class="visually-hidden">Remove process</span></th></tr></thead>
              <tbody class="process-rows"></tbody>
            </table>
          </div>
          <div class="scheduler-actions">
            <button class="secondary-button add-process" type="button">Add process</button>
            <label class="quantum-control">Round Robin quantum<input class="quantum-input" type="number" min="1" max="100000" step="1" value="2" required></label>
            <button class="calculate-button" type="submit">Generate all charts</button>
          </div>
          <p class="scheduler-error" role="alert" hidden></p>
        </form>
        <div class="scheduler-results" aria-live="polite">
          <p class="scheduler-placeholder">Add your processes, then generate the charts to compare their schedules and timing metrics.</p>
        </div>`;

      const form = scheduler.querySelector(".scheduler-form");
      const rows = scheduler.querySelector(".process-rows");
      const addButton = scheduler.querySelector(".add-process");
      const error = scheduler.querySelector(".scheduler-error");
      const results = scheduler.querySelector(".scheduler-results");
      let nextId = 1;

      function addProcessRow(values = {}) {
        const row = document.createElement("tr");
        const id = values.pid || `P${nextId}`;
        nextId += 1;
        row.innerHTML = `
          <td><input class="process-id" aria-label="Process ID" type="text" maxlength="12" pattern="[A-Za-z0-9_\\x2d]+" required></td>
          <td><input aria-label="Arrival time" type="number" min="0" max="100000" step="1" required></td>
          <td><input aria-label="Burst time" type="number" min="1" max="100000" step="1" required></td>
          <td><input aria-label="Priority" type="number" min="1" max="100000" step="1" required></td>
          <td><button class="remove-process" type="button" aria-label="Remove ${id}">×</button></td>`;
        const inputs = row.querySelectorAll("input");
        inputs[0].value = id;
        inputs[1].value = values.arrival ?? 0;
        inputs[2].value = values.burst ?? 1;
        inputs[3].value = values.priority ?? 1;
        rows.append(row);
        addButton.disabled = rows.children.length >= 20;
        addButton.setAttribute("aria-disabled", String(addButton.disabled));
      }

      [
        { pid: "P1", arrival: 0, burst: 5, priority: 2 },
        { pid: "P2", arrival: 1, burst: 3, priority: 1 },
        { pid: "P3", arrival: 2, burst: 8, priority: 4 },
        { pid: "P4", arrival: 3, burst: 6, priority: 2 }
      ].forEach(process => addProcessRow(process));

      addButton.addEventListener("click", () => {
        if (rows.children.length < 20) addProcessRow();
      });

      rows.addEventListener("click", event => {
        if (event.target.closest(".remove-process") && rows.children.length > 1) {
          event.target.closest("tr").remove();
          addButton.disabled = false;
          addButton.setAttribute("aria-disabled", "false");
        }
      });

      form.addEventListener("submit", event => {
        event.preventDefault();
        error.hidden = true;
        error.textContent = "";
        if (!form.reportValidity()) return;

        const processes = [...rows.querySelectorAll("tr")].map((row, index) => {
          const inputs = row.querySelectorAll("input");
          return {
            pid: inputs[0].value.trim(),
            arrival: Number(inputs[1].value),
            burst: Number(inputs[2].value),
            priority: Number(inputs[3].value),
            index
          };
        });
        if (new Set(processes.map(process => process.pid.toLowerCase())).size !== processes.length) {
          error.textContent = "Process IDs must be unique (IDs are compared without case sensitivity).";
          error.hidden = false;
          return;
        }

        const quantum = Number(scheduler.querySelector(".quantum-input").value);
        const roundRobinSegments = processes.reduce((total, process) => total + Math.ceil(process.burst / quantum), 0);
        if (roundRobinSegments > 2000) {
          error.textContent = "This Round Robin input would create more than 2,000 chart segments. Increase the quantum or reduce the total burst time.";
          error.hidden = false;
          return;
        }

        const byArrival = (a, b) => a.arrival - b.arrival || a.index - b.index;
        const shortestJob = (a, b) => a.burst - b.burst || byArrival(a, b);
        const shortestRemaining = (a, b) => a.remaining - b.remaining || byArrival(a, b);
        const priority = (a, b) => a.priority - b.priority || byArrival(a, b);
        const algorithms = [
          { name: "First-Come, First-Served (FCFS)", description: "Non-preemptive; processes run in arrival order.", run: () => scheduleNonPreemptive(processes, byArrival) },
          { name: "Shortest Job First (SJF)", description: "Non-preemptive; chooses the ready process with the shortest burst.", run: () => scheduleNonPreemptive(processes, shortestJob) },
          { name: "Shortest Remaining Time First (SRTF)", description: "Preemptive; always runs the ready process with the least remaining burst.", run: () => schedulePreemptive(processes, shortestRemaining) },
          { name: "Round Robin (RR)", description: `Preemptive; ready processes take turns with a quantum of ${quantum}.`, run: () => scheduleRoundRobin(processes, quantum) },
          { name: "Non-Preemptive Priority", description: "Runs the highest-priority ready process to completion; lower priority numbers rank higher.", run: () => scheduleNonPreemptive(processes, priority) },
          { name: "Preemptive Priority", description: "A newly arrived higher-priority process can interrupt the running process; lower numbers rank higher.", run: () => schedulePreemptive(processes, priority) }
        ];
        results.replaceChildren(...algorithms.map(algorithm =>
          renderScheduleResult(algorithm, processes, algorithm.run())
        ));
      });

      return scheduler;
    }

    function makeTopic(topic) {
      const column = document.createElement("article");
      column.className = `topic-column ${topic.color}`;
      const card = document.createElement("div");
      card.className = "topic-card";
      const head = document.createElement("div");
      head.className = "topic-head";
      const button = document.createElement("button");
      button.className = "topic-toggle";
      button.type = "button";
      button.setAttribute("aria-expanded", "false");
      button.setAttribute("aria-controls", `${topic.id}-branch`);
      const icon = document.createElement("span");
      icon.className = "topic-icon";
      icon.innerHTML = icons[topic.icon];
      icon.setAttribute("aria-hidden", "true");
      const labels = document.createElement("span");
      labels.className = "topic-labels";
      const title = document.createElement("span");
      title.className = "topic-title";
      title.textContent = topic.title;
      const subtitle = document.createElement("span");
      subtitle.className = "topic-kicker";
      subtitle.textContent = topic.short;
      labels.append(title, subtitle);
      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.innerHTML = icons.chevron;
      chevron.setAttribute("aria-hidden", "true");
      button.append(icon, labels, chevron);
      head.append(button);
      const hint = document.createElement("div");
      hint.className = "topic-hint";
    //   hint.innerHTML = '<span class="hint-dot" aria-hidden="true"></span><span>Click to explore this branch</span>';
      head.append(hint);
      const branch = document.createElement("div");
      branch.className = "branch topic-branch";
      branch.id = `${topic.id}-branch`;
      branch.setAttribute("aria-hidden", "true");
      const inner = document.createElement("div");
      inner.className = "branch-inner";
      const list = document.createElement("ul");
      list.className = "tree";
      topic.children.forEach(node => list.append(makeNode(node)));
      inner.append(list);
      if (topic.id === "cpu-scheduling") inner.append(makeScheduler());
      branch.append(inner);
      button.addEventListener("click", () => {
        const isOpen = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", String(!isOpen));
        branch.classList.toggle("is-open", !isOpen);
        branch.setAttribute("aria-hidden", String(isOpen));
      });
      card.append(head, branch);
      column.append(card);
      return column;
    }

    topics.forEach(topic => grid.append(makeTopic(topic)));

  </script>
</body>
